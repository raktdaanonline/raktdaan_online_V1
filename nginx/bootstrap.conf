# BloodInfo-owned HTTP bootstrap only. Install only as bloodinfo.conf.
server {
    listen 80;
    server_name bloodinfo.in;
    add_header X-BloodInfo-App frontend always;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503 'BloodInfo certificate setup in progress';
    }
}

server {
    listen 80;
    server_name admin.bloodinfo.in;
    add_header X-BloodInfo-App admin always;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503 'BloodInfo certificate setup in progress';
    }
}
