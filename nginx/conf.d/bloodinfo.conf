# BloodInfo-owned routes for the existing central nginx.
server {
    listen 80;
    server_name bloodinfo.in;
    add_header X-BloodInfo-App frontend always;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://bloodinfo.in$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bloodinfo.in;
    ssl_certificate /etc/letsencrypt/live/bloodinfo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bloodinfo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bloodinfo_app bloodinfo_frontend:80;
    set $bloodinfo_api bloodinfo_backend:5000;
    proxy_hide_header X-BloodInfo-App;
    add_header X-BloodInfo-App frontend always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://$bloodinfo_api;
        proxy_read_timeout 120s;
    }
    location /socket.io/ {
        proxy_pass http://$bloodinfo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
    location /uploads/ {
        proxy_pass http://$bloodinfo_api;
    }
    location / {
        proxy_pass http://$bloodinfo_app;
    }
}

server {
    listen 80;
    server_name admin.bloodinfo.in;
    add_header X-BloodInfo-App admin always;
    location /.well-known/acme-challenge/ {
