name: bloodinfo

services:
  bloodinfo_backend:
    image: bloodinfo-backend:${SOURCE_COMMIT:?Set SOURCE_COMMIT to the release SHA}
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bloodinfo_backend
    restart: unless-stopped
    env_file:
      - ${BLOODINFO_APP_ENV:-./Backend/.env}
    environment:
      NODE_ENV: production
      PORT: "5000"
      FRONTEND_URL: https://bloodinfo.in
      NODE_OPTIONS: --max-old-space-size=512
    expose:
      - "5000"
    volumes:
      - bloodinfo_uploads:/app/uploads
      - bloodinfo_sessions:/app/.sessions
    networks:
      - bloodinfo_internal
      - goairclass_proxy
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  bloodinfo_frontend:
    image: bloodinfo-frontend:${SOURCE_COMMIT:?Set SOURCE_COMMIT to the release SHA}
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: https://bloodinfo.in/api
        VITE_SOCKET_URL: https://bloodinfo.in
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT}
    container_name: bloodinfo_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - bloodinfo_internal
      - goairclass_proxy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/bloodinfo-build.json"]
      interval: 15s
      timeout: 5s
      retries: 5

  bloodinfo_admin:
    image: bloodinfo-admin:${SOURCE_COMMIT:?Set SOURCE_COMMIT to the release SHA}
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_APP_API_URL: https://admin.bloodinfo.in/api
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT}
    container_name: bloodinfo_admin
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - bloodinfo_internal
      - goairclass_proxy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/bloodinfo-build.json"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  bloodinfo_uploads:
    name: bloodinfo_uploads
  bloodinfo_sessions:
    name: bloodinfo_sessions

networks:
  bloodinfo_internal:
    name: bloodinfo_internal
    internal: true
    driver: bridge
  goairclass_proxy:
    name: goairclass_proxy
    external: true
